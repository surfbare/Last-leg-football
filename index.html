<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Leg</title><style>body{font-family:system-ui;margin:0;background:#081b35;color:#142439}main{max-width:900px;margin:auto;padding:24px}section{background:#fffaf1;border-radius:22px;padding:24px;box-shadow:0 15px 40px #0005}h1{color:white}h2{font-size:34px;margin:8px 0}input,button{padding:13px;border-radius:10px;border:1px solid #ccd8dc;font-size:16px}button{background:#ff7043;color:white;border:0;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;margin:12px 0}.row>*{flex:1}.hidden{display:none}.code{font-size:42px;font-weight:900;letter-spacing:8px;color:#18a261}.players,.feed{padding:12px;background:#eef6f1;border-radius:12px}.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:white;color:#142439;text-align:left;min-height:150px;border:2px solid #e9e1d3}.card b{display:block;font-size:20px;margin:12px 0}.small{color:#63798d;font-size:13px}.danger{background:#8e2940}.modal.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modal>div{background:#fffaf1;border-radius:20px;padding:25px;max-width:380px;text-align:center}.shot-art{width:150px;height:115px;margin:0 auto 5px;animation:deliver .65s ease-out}@keyframes deliver{0%{transform:translateX(45px) scale(.8);opacity:0}70%{transform:translateX(-5px) scale(1.04)}100%{transform:none;opacity:1}}.modal button{display:block;width:100%;margin-top:9px}@media(max-width:600px){.row{flex-direction:column}}</style><main><h1>🏈 THE LAST LEG</h1><section id="home"><h2>Play together</h2><p>Create a game and share the code, or join someone else's game.</p><div class="row"><input id="name" placeholder="Your name"><button onclick="create()">Create game</button></div><div class="row"><input id="joinCode" placeholder="Game code"><button onclick="join()">Join game</button></div><p id="msg" class="small"></p></section><section id="lobby" class="hidden"><p class="small">Share this code:</p><div class="code" id="code"></div><h2>Lobby</h2><div id="players" class="players"></div><button id="start" onclick="start()">Start game</button><p id="lmsg" class="small"></p></section><section id="game" class="hidden"><button id="end" class="danger" onclick="endGame()">End football game</button><h2 id="hello"></h2><div id="scores" class="players"></div><h3>Your cards</h3><div id="hand" class="hand"></div><h3>Activity</h3><div id="feed" class="feed small"></div><p id="gmsg" class="small"></p></section></main><div id="modal" class="modal hidden"><div><h2 id="alertTitle"></h2><p id="alertText"></p><button onclick="closeModal()">OK</button></div></div><script>let me,room,version=0,ended=false;const $=x=>document.getElementById(x);async function api(p,b){let r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}function show(x){['home','lobby','game'].forEach(i=>$(i).classList.toggle('hidden',i!==x))}function save(x){me=x.playerId||me;room=x.code;version=x.version;render(x);poll()}async function create(){let x=await api('/api/create',{name:$('name').value});if(x.error)return $('msg').textContent=x.error;save(x)}async function join(){let x=await api('/api/join',{name:$('name').value,code:$('joinCode').value});if(x.error)return $('msg').textContent=x.error;save(x)}async function start(){save(await api('/api/start',{code:room,playerId:me}))}async function endGame(){if(confirm('End the football game and show final scores?'))save(await api('/api/end',{code:room,playerId:me}))}function render(x){ended=x.ended;if(x.started){show('game');$('hello').textContent=x.ended?'Final scores — game ended':'Game '+x.code;$('end').style.display=x.ended?'none':'block';$('scores').innerHTML=x.players.map(p=>p.name+': <b>'+p.score+' pts</b>').join(' · ');$('hand').innerHTML=x.ended?'':x.hand.map((c,i)=>`<button class="card" onclick="score(${i})"><b>${c[0]}</b><span>${c[1]}</span><br><span class="small">${c[1]} · ${c[2]} points</span>${c[2]>=4?'<br><small>High-value card: may give a shot</small>':''}</button>`).join('');$('feed').innerHTML=(x.events||[]).map(e=>'<div>'+e+'</div>').join('')}else{show('lobby');$('code').textContent='ROOM CODE: '+(x.code||room||'—');$('players').innerHTML=x.players.map(p=>p.name+' · '+p.score+' pts').join('<br>');$('start').style.display=x.host===me?'block':'none'}}async function score(i){let x=await api('/api/score',{code:room,playerId:me,card:i});if(x.error)return $('gmsg').textContent=x.error;render(x);if(x.hand.length)showGive(x)}function showGive(x){let others=x.players.filter(p=>p.id!==me);if(!others.length)return;let m=$('modal');$('alertTitle').textContent='Give a shot';$('alertText').textContent='Choose who receives a shot from you.';m.querySelector('div').innerHTML='<h2>Give a shot</h2><p>Choose a player:</p>'+others.map(p=>`<button onclick="give('${p.id}','${p.name}')">${p.name}</button>`).join('')+'<button onclick="closeModal()">Cancel</button>';m.classList.remove('hidden')}async function give(id,name){closeModal();let x=await api('/api/give',{code:room,playerId:me,targetId:id});render(x)}function closeModal(){$('modal').classList.add('hidden')}function alertShot(from){$('alertTitle').textContent='🥃 You got a shot';$('alertText').innerHTML='<svg class="shot-art" viewBox="0 0 180 130" aria-label="A hand passing a shot glass"><path d="M8 104c28-25 50-25 74-11l26 15c10 6 22 5 29-4l28-37 9 8-27 42c-12 18-31 22-48 12l-30-17c-13-7-27-7-43 3z" fill="#f2ad84"/><path d="M70 41h56l-8 49c-2 10-10 16-20 16h-8c-10 0-18-6-20-16z" fill="#b9e5f2" stroke="#123d68" stroke-width="4"/><path d="M73 68h51l-4 22c-2 10-10 16-20 16h-5c-10 0-18-6-20-16z" fill="#f6b43c"/><path d="M68 42h60" stroke="#123d68" stroke-width="5" stroke-linecap="round"/><path d="M143 27l5 10m12-2-5 9m-14-20 9 2" stroke="#ff7043" stroke-width="4" stroke-linecap="round"/></svg><br><strong>'+from+'</strong> handed you a shot';$('modal').classList.remove('hidden');if(navigator.vibrate)navigator.vibrate([250,100,250])}async function poll(){setTimeout(async()=>{let x=await (await fetch('/api/state?code='+room+'&player='+me)).json();if(!x.error&&x.version!==version){if(x.alert&&x.alert.to===me)alertShot(x.alert.from);render(x)}poll()},1500)}</script>

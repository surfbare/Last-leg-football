<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Leg</title><style>body{font-family:system-ui;margin:0;background:#081b35;color:#142439}main{max-width:900px;margin:auto;padding:24px}section{background:#fffaf1;border-radius:22px;padding:24px;box-shadow:0 15px 40px #0005}h1{color:white}h2{font-size:34px;margin:8px 0}input,button{padding:13px;border-radius:10px;border:1px solid #ccd8dc;font-size:16px}button{background:#ff7043;color:white;border:0;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;margin:12px 0}.row>*{flex:1}.hidden{display:none}.code{font-size:42px;font-weight:900;letter-spacing:8px;color:#18a261}.players{padding:12px;background:#eef6f1;border-radius:12px}.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:white;color:#142439;text-align:left;min-height:150px;border:2px solid #e9e1d3}.card b{display:block;font-size:20px;margin:12px 0}.small{color:#63798d;font-size:13px}@media(max-width:600px){.row{flex-direction:column}}</style><main><h1>🏈 THE LAST LEG</h1><section id="home"><h2>Play together</h2><p>Create a game and share the code, or join someone else's game.</p><div class="row"><input id="name" placeholder="Your name"><button onclick="create()">Create game</button></div><div class="row"><input id="joinCode" placeholder="Game code"><button onclick="join()">Join game</button></div><p id="msg" class="small"></p></section><section id="lobby" class="hidden"><p class="small">Share this code with everyone:</p><div class="code" id="code"></div><h2>Lobby</h2><div id="players" class="players"></div><button id="start" onclick="start()">Start game</button><p id="lmsg" class="small"></p></section><section id="game" class="hidden"><h2 id="hello"></h2><p class="small">Tap your card when the event happens on TV. It scores points and deals a replacement.</p><div id="scores" class="players"></div><h3>Your five cards</h3><div id="hand" class="hand"></div><p id="gmsg" class="small"></p></section></main><script>let me,room,version=0;const $=x=>document.getElementById(x);async function api(p,b){let r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}function show(x){['home','lobby','game'].forEach(i=>$(i).classList.toggle('hidden',i!==x))}function save(x){me=x.playerId;room=x.code;version=x.version;render(x);poll()}async function create(){let x=await api('/api/create',{name:$('name').value});if(x.error)return $('msg').textContent=x.error;save(x)}async function join(){let x=await api('/api/join',{name:$('name').value,code:$('joinCode').value});if(x.error)return $('msg').textContent=x.error;save(x)}async function start(){let x=await api('/api/start',{code:room,playerId:me});if(x.error)return $('lmsg').textContent=x.error;render(x)}function render(x){if(x.started){show('game');$('hello').textContent='Game '+x.code;$('scores').innerHTML=x.players.map(p=>p.name+': <b>'+p.score+' pts</b>').join(' · ');$('hand').innerHTML=x.hand.map((c,i)=>`<button class="card" onclick="score(${i})"><b>${c[0]}</b><span>${c[1]}</span><br><span class="small">${c[1]} · ${c[2]} points</span></button>`).join('')}else{show('lobby');$('code').textContent=x.code;$('players').innerHTML=x.players.map(p=>p.name+' · '+p.score+' pts').join('<br>');$('start').style.display=x.host===me?'block':'none'}}async function score(i){let x=await api('/api/score',{code:room,playerId:me,card:i});if(x.error)return $('gmsg').textContent=x.error;render(x)}async function poll(){setTimeout(async()=>{let r=await fetch('/api/state?code='+room+'&player='+me),x=await r.json();if(!x.error&&x.version!==version)render(x);poll()},1500)}</script>
